name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # Refresh live wires at least every 6h (covers the 24h papers cadence too)
    - cron: '0 0,6,12,18 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Restore story cache
        uses: actions/cache@v4
        with:
          path: |
            .cache/stories
            .cache/covers
          key: enrich-v2-${{ github.run_id }}
          restore-keys: |
            enrich-v2-
      - name: Install
        run: npm ci
      - name: Build
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          POLLINATIONS_KEY: ${{ secrets.POLLINATIONS_KEY }}
        run: npm run build
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
